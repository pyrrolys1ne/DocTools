[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doctools"
version = "1.2.0"
description = "批量文档处理命令行工具（Word 去页眉、PDF 转 PPT 等）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "pyrrolys1ne" }]
keywords = ["pdf", "docx", "word", "pptx", "document", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
dependencies = [
    "pdf2docx>=0.5.8",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=4.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]
web = [
    "fastapi>=0.110.0",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.29.0",
]
# 转 PDF（Word/PPT → PDF）需要本机安装 Microsoft Office。
# 安装：pip install "doctools[office]"
office = [
    "pywin32>=306",
]

[project.scripts]
doctools = "doctools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/doctools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
